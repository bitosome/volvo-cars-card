<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Volvo Cars Card · Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --ha-card-background: #27293b;
        --card-background-color: #27293b;
        --primary-background-color: #1b1d2a;
        --primary-text-color: #dedff5;
        --secondary-text-color: #adb4cf;
        --divider-color: #aeb6d524;
        --accent-color: #bba3f2;
        --primary-color: #bba3f2;
        background: #141621;
        color: var(--primary-text-color);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 20px;
      }
      main {
        max-width: 1080px;
        margin: auto;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 26px;
      }
      h1 {
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.04em;
        margin: 0 0 7px;
      }
      p {
        color: var(--secondary-text-color);
        font-size: 13px;
        line-height: 1.5;
        margin: 0;
      }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button,
      select {
        min-height: 44px;
        border: 1px solid var(--divider-color);
        border-radius: 12px;
        color: inherit;
        background: var(--ha-card-background);
        font: inherit;
        font-size: 12px;
        padding: 9px 12px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(
          auto-fit,
          minmax(min(100%, var(--width, 480px)), var(--width, 480px))
        );
        justify-content: center;
        align-items: start;
        gap: 22px;
      }
      .cards > * {
        min-width: 0;
      }
      .notice {
        margin: 24px 0;
        text-align: center;
        font-size: 11px;
      }
      #log {
        font-size: 12px;
        color: var(--secondary-text-color);
        overflow-wrap: anywhere;
      }
      .light {
        color-scheme: light;
        --ha-card-background: #f5f5fa;
        --card-background-color: #f5f5fa;
        --primary-background-color: #fff;
        --primary-text-color: #30364b;
        --secondary-text-color: #626a80;
        --divider-color: #4d567924;
        --accent-color: #7959ab;
        --primary-color: #7959ab;
        background: #eaeaf2;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Your cars, at a glance.</h1>
          <p>Battery, charging and the things to check before you leave.</p>
        </div>
        <div class="controls">
          <select aria-label="Scenario" id="scenario">
            <option value="idle">Parked</option>
            <option value="waiting" selected>Connected · charger paused</option>
            <option value="charging">Charging</option>
            <option value="open">Open door & window</option>
            <option value="fault">Charging error</option>
            <option value="unknown">Unavailable readings</option></select
          ><select id="width" aria-label="Card width">
            <option>320</option>
            <option>390</option>
            <option selected>480</option>
            <option>600</option></select
          ><button id="theme">Light theme</button>
        </div>
      </header>
      <div class="cards">
        <volvo-cars-card id="car-a"></volvo-cars-card
        ><volvo-cars-card id="car-b"></volvo-cars-card>
      </div>
      <p class="notice">
        Synthetic preview · no car connected · actions are simulated
      </p>
      <div id="log" role="status"></div>
    </main>
    <script type="module">
      import { paths } from './icons.js';
      customElements.define(
        'ha-icon',
        class extends HTMLElement {
          constructor() {
            super();
            this.attachShadow({ mode: 'open' });
            this.shadowRoot.innerHTML =
              '<style>:host{display:inline-flex}svg{display:block;width:100%;height:100%;fill:currentColor}</style><svg viewBox="0 0 24 24" aria-hidden="true"><path/></svg>';
          }
          set icon(v) {
            this.value = v;
            this.paint();
          }
          get icon() {
            return this.value;
          }
          connectedCallback() {
            this.paint();
          }
          paint() {
            this.shadowRoot
              .querySelector('path')
              .setAttribute(
                'd',
                paths[
                  (this.value ?? this.getAttribute('icon') ?? '').replace(
                    'mdi:',
                    '',
                  )
                ] ?? paths['information-outline'],
              );
          }
        },
      );
      await import('../dist/volvo-cars-card.js');
      const cars = [
        ['car-a', 'xc40', 73, 220, 90],
        ['car-b', 'ex30', 26, 87, 100],
      ];
      const doors = [
        'door_front_left',
        'door_front_right',
        'door_rear_left',
        'door_rear_right',
        'window_front_left',
        'window_front_right',
        'window_rear_left',
        'window_rear_right',
        'bonnet',
        'tailgate',
        'sunroof',
        'tank_lid',
      ];
      const buttons = [
        'start_climatisation',
        'stop_climatisation',
        'flash',
        'honk',
        'honk_flash',
      ];
      const ent = (state, attributes = {}) => ({
        state: String(state),
        attributes,
        last_updated: '2026-10-20T10:00:00Z',
      });
      function update() {
        const scenario = document.querySelector('#scenario').value;
        for (const [id, key, battery, range, target] of cars) {
          const node = document.getElementById(id),
            p = 'volvo_' + key + '_',
            connected = scenario !== 'idle';
          const states = {
            ['lock.' + p + 'lock']: ent('locked'),
            ['sensor.' + p + 'battery']: ent(battery),
            ['sensor.' + p + 'distance_to_empty_battery']: ent(range, {
              unit_of_measurement: 'km',
            }),
            ['sensor.' + p + 'target_battery_charge_level']: ent(target),
            ['sensor.' + p + 'charging_connection_status']: ent(
              connected ? 'connected' : 'disconnected',
            ),
            ['sensor.' + p + 'charging_status']: ent(
              scenario === 'charging'
                ? 'charging'
                : scenario === 'fault'
                  ? 'error'
                  : 'idle',
            ),
            ['sensor.' + p + 'charging_power_status']: ent(
              scenario === 'charging'
                ? 'providing_power'
                : scenario === 'waiting'
                  ? 'fault'
                  : 'no_power_available',
            ),
            ['sensor.' + p + 'charging_power']: ent(
              scenario === 'charging' ? 7400 : 0,
              { unit_of_measurement: 'W' },
            ),
            ['sensor.' + p + 'estimated_charging_time']: ent(72, {
              unit_of_measurement: 'min',
            }),
            ['sensor.' + p + 'charging_type']: ent('ac'),
            ['sensor.' + p + 'odometer']: ent(18400, {
              unit_of_measurement: 'km',
            }),
            ['device_tracker.' + p + 'location']: ent('home'),
          };
          for (const door of doors)
            states['binary_sensor.' + p + door] = ent(
              scenario === 'open' &&
                ['door_rear_left', 'window_front_right'].includes(door)
                ? 'on'
                : 'off',
            );
          for (const action of buttons)
            states['button.' + p + action] = ent('unknown');
          if (scenario === 'unknown')
            for (const [id, e] of Object.entries(states))
              if (!id.startsWith('button.')) e.state = 'unavailable';
          const hass = {
            states,
            callService: async (domain, service, data) => {
              document.querySelector('#log').textContent =
                `Simulated ${domain}.${service} · ${data.entity_id}`;
              if (domain === 'lock') {
                states[data.entity_id] = ent(
                  service === 'lock' ? 'locked' : 'unlocked',
                );
                node.hass = { ...hass, states: { ...states } };
              }
            },
            hassUrl: (path) => path,
          };
          node.setConfig({
            type: 'custom:volvo-cars-card',
            car: key,
            name: 'Volvo ' + key.toUpperCase(),
            image: './car.svg',
            show: ['charging', 'openings', 'actions', 'odometer'],
          });
          node.hass = hass;
          node.addEventListener(
            'hass-more-info',
            (event) =>
              (document.querySelector('#log').textContent =
                'Simulated entity details · ' + event.detail.entityId),
          );
        }
      }
      document.querySelector('#scenario').addEventListener('change', update);
      document
        .querySelector('#width')
        .addEventListener('change', (event) =>
          document
            .querySelector('.cards')
            .style.setProperty('--width', event.target.value + 'px'),
        );
      document.querySelector('#theme').onclick = (event) => {
        document.documentElement.classList.toggle('light');
        event.target.textContent = document.documentElement.classList.contains(
          'light',
        )
          ? 'Dark theme'
          : 'Light theme';
      };
      update();
    </script>
  </body>
</html>
